plugins {
    id 'application'
    id 'java'
    id 'org.springframework.boot' version '4.0.0-M2' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.kalaazu'
version = '0.0.1-SNAPSHOT'

application {
    mainClass = 'com.kalaazu.Launcher'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation project(':Launcher')
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.openjfx.javafxplugin'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
    }

    group 'com.kalaazu'

    javafx {
        version = '25'
        modules = ['javafx.controls', 'javafx.fxml']
    }

    task printClasspath {
        doLast {
            println "JavaFX Path:"
            println sourceSets.main.runtimeClasspath.filter { it.name.contains("javafx") }.asPath
        }
    }

    repositories {
        mavenCentral()
        mavenLocal()
    }

    jar {
        enabled = true
    }


    ext {
        ikonliVersion = '12.4.0'
        atlantaVersion = '2.1.0'
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-json'
        implementation 'org.springframework.boot:spring-boot-starter-aop'
        testImplementation('org.springframework.boot:spring-boot-starter-test') {
            exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        }
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.springframework.security:spring-security-test'
        compileOnly 'org.projectlombok:lombok:1.18.40'
        annotationProcessor 'org.projectlombok:lombok:1.18.40'
        implementation 'org.reflections:reflections:0.10.2'
        implementation 'org.modelmapper:modelmapper:3.1.0'

        implementation("io.github.mkpaz:atlantafx-base:$atlantaVersion")
        implementation("io.github.mkpaz:atlantafx-styles:$atlantaVersion")


        // Ikonli
        implementation("org.kordamp.ikonli:ikonli-javafx:$ikonliVersion")
        implementation("org.kordamp.ikonli:ikonli-feather-pack:$ikonliVersion")
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.0-M2'
        }
    }

    test {
        useJUnitPlatform()
    }
}
