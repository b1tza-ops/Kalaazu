name: Build

on:
  push:
    branches:
      - develop
      - "setup/**"
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  gradle:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/windows/Import-DotEnv.ps1",
            "scripts/windows/setup-local.ps1",
            "scripts/windows/run-local.ps1"
          )

          $parseErrors = @()
          foreach ($script in $scripts) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            $parseErrors += $errors
          }

          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: .\gradlew.bat clean build --stacktrace
