name: Build

on:
  push:
    branches:
      - develop
      - "setup/**"
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  gradle:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: .\gradlew.bat clean build --stacktrace
