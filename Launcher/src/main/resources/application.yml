spring:
  main:
    lazy-initialization: true
  threads:
    virtual:
      enabled: true

  datasource:
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    url: jdbc:mariadb://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:kalaazu}

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update

  profiles:
    active: dev

app:
  autoStart: ${AUTO_START:true}
  game:
    version: ${GAME_VERSION:V4} # Game server version, see com.kalaazu.model.Version
    renderDistance: ${RENDER_DISTANCE:3000}
    packets:
      printOut: true
      printIn: true

  port:
    server: ${GAME_SERVER_PORT:8080}
    policy: ${POLICY_SERVER_PORT:843}
    chat: ${CHAT_SERVER_PORT:8082}

server:
  port: ${WEB_SERVER_PORT:8081}
